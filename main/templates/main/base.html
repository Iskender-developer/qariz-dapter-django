<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ledger{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <style>
    :root{--bg:#fafafa;--fg:#09090b;--muted:#52525b;--border:#e4e4e7;--input:#d4d4d8;--primary:#18181b;--neg:#b42318;--neg-border:#fda29b;--pos:#15803d;--radius:12px}
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--fg);-webkit-font-smoothing:antialiased}
    a{text-decoration:none;color:inherit}
    .wrap{max-width:1120px;margin:0 auto;padding:0 24px}
    .nav{background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
    .nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
    .brand{font-weight:700;font-size:18px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
    main.wrap{padding-top:40px;padding-bottom:48px}
    h1{margin:0;font-size:28px;letter-spacing:-.02em}
    .mut{color:var(--muted);font-size:14px}
    .neg{color:var(--neg)}.pos{color:var(--pos)}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:44px;padding:0 18px;border-radius:8px;font:500 14px Inter,sans-serif;background:var(--primary);color:#fff;border:1px solid var(--primary);cursor:pointer}
    .btn:hover{opacity:.9}
    .btn:focus-visible,input:focus-visible,.card-link:focus-visible{outline:2px solid #2563eb;outline-offset:2px}
    .btn.out{background:#fff;color:var(--fg);border-color:var(--input)}
    .btn.bad{background:#fff;color:var(--neg);border-color:var(--neg-border)}
    .card{background:#fff;border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 1px 2px rgba(0,0,0,.04)}
    .av{width:44px;height:44px;border-radius:50%;background:#f4f4f5;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;color:#3f3f46;flex:none;text-transform:uppercase}
    .field{margin-bottom:18px}
    .field label{display:block;font-weight:500;font-size:14px;margin-bottom:8px}
    input[type=text],input[type=number],input[type=tel]{height:44px;width:100%;border:1px solid var(--input);border-radius:8px;padding:0 12px;font:400 15px Inter,sans-serif;background:#fff}
    .errorlist{list-style:none;margin:6px 0 0;padding:0;color:var(--neg);font-size:13px}
  </style>
</head>
<body>
  <header class="nav">
    <div class="wrap">
      <a class="brand" href="{% url 'home' %}">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/></svg>
        Ledger
      </a>
      {% block nav_action %}{% endblock %}
    </div>
  </header>
  <main class="wrap">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
